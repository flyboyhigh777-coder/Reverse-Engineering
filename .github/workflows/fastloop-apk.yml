# Builds the FastLoop APK with the real Android toolchain.
#
# It cannot be built where it is written: that container's network policy
# denies dl.google.com and maven.google.com, which serve the Android SDK and
# every AndroidX artifact, so the in-container build assembles an APK out of
# whatever Maven Central happens to carry and is capped at a 2016 dexer with
# no dependencies at all. A GitHub runner has the SDK installed and no such
# policy, so this is where Gradle, AGP and AndroidX actually run.
name: FastLoop APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'clones/fastloop/**'
      - '.github/workflows/fastloop-apk.yml'

permissions:
  # Writes the release the APK is attached to.
  contents: write

defaults:
  run:
    working-directory: clones/fastloop

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clones/fastloop/package-lock.json

      # The page is the app: without it the APK installs and opens blank.
      - name: Собрать страницу
        run: |
          npm ci
          npm run build
          test -s dist/index.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # verifySigning reads the certificate out of the finished APK, not out
      # of the keystore: the fingerprint that matters is the one the phone
      # compares against, and an update signed by any other certificate
      # cannot be installed over what is already there.
      - name: Собрать и проверить APK
        run: gradle -p android --no-daemon :app:reportHealthConnect :app:assembleRelease :app:verifySigning

      - name: Показать, что получилось
        run: ls -la android/app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: fastloop-apk
          path: clones/fastloop/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A link that installs on a phone in one tap.
      #
      # An artifact always downloads as a zip, and Android will not install
      # an APK out of one: it has to be found in a file manager and
      # extracted first. A release asset downloads as the file itself.
      #
      # The asset keeps one name on purpose. GitHub serves
      # /releases/latest/download/<name>, so a fixed name means one address
      # that always points at the newest build and never has to be sent
      # again. The tag carries the version, so older builds stay reachable.
      - name: Выложить в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -o 'android:versionName="[^"]*"' android/AndroidManifest.xml | cut -d'"' -f2)
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" fastloop.apk
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" fastloop.apk --clobber
          else
            gh release create "$tag" fastloop.apk \
              --title "FastLoop $version" \
              --notes "Сборка из ветки ${{ github.ref_name }}, коммит ${{ github.sha }}." \
              --latest
          fi
